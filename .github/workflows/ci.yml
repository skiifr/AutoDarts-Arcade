name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - name: Games coverage gate (100 % branches in every module.ts)
        run: yarn coverage
      - name: Headless runner smoke test (a Siege fixture through the engine, in Node)
        run: yarn play-headless --game siege --script packages/games/src/siege/fixtures/hard-last-standing.json
      - name: Web export smoke build
        run: yarn export:web
